# Spring profile for Redis Cluster mode

# Redis Cluster node list (host app talks to ports 7000-7005)
spring.redis.cluster.nodes=localhost:7000,localhost:7001,localhost:7002,localhost:7003,localhost:7004,localhost:7005

# Timeouts and adaptive topology refresh for Lettuce
spring.redis.timeout=2s
spring.redis.lettuce.cluster.refresh.adaptive=true
spring.redis.lettuce.cluster.refresh.period=10s

# Spring Session still uses Redis
spring.session.store-type=redis

# Avoid attempting to auto-configure keyspace notifications on cluster nodes
# (we already set --notify-keyspace-events Ex in docker-compose)
spring.session.redis.configure-action=none

