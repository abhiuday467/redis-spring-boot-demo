# Server configuration
server.port=8080

# Application name
spring.application.name=demo

# Logging configuration
logging.level.com.redis.demo=INFO

# Redis Configuration (single-node mode by default)
# - Single node (default): use this file. Start Redis with `docker compose up -d redis`.
# - Cluster mode: run the app with the `cluster` profile to load
#   `application-cluster.properties` (e.g. `-Dspring.profiles.active=cluster`).
#   Do not mix single-node and cluster properties.
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=

# Spring Session (Redis-backed HTTP sessions)
spring.session.store-type=redis
server.servlet.session.timeout=30m
# Optional cookie customizations
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# --- MySQL Datasource (local compose) ---
spring.datasource.url=jdbc:mysql://localhost:3306/appdb
spring.datasource.username=appuser
spring.datasource.password=apppass
# Optional (Boot can auto-detect)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Let Flyway manage schema, disable Hibernate DDL auto
spring.jpa.hibernate.ddl-auto=none
