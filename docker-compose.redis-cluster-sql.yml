services:
  redis-7000:
    image: redis:7-alpine
    command: [
      "redis-server",
      "--port","7000",
      "--cluster-enabled","yes",
      "--cluster-config-file","nodes.conf",
      "--cluster-node-timeout","5000",
      "--appendonly","yes",
      "--cluster-announce-port","7000",
      "--cluster-announce-bus-port","17000",
      "--cluster-announce-ip","redis-7000"
    ]
    ports:
      - "7000:7000"
      - "17000:17000"
    volumes:
      - redis-7000-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

